<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
    .red-circle{
      width:200px;
      height:200px;
      background-color:black;
      border-radius:50%;
      position:absolute;
      top:200px;
      left:250px;
      border:10px dashed orange;
    }

    .blue-box{
      position:relative;
      height:300px;
      width:400px;
      background-color:skyblue;
      top:200px;
      left:20px;
      border:10px solid black;
      
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
